# Railway reads env vars from the dashboard — no .env file in production.
# Discovery includes website email scraping by default (slower but finds more emails).
# Set SKIP_ENRICHMENT=true only if you need faster map-only runs.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "node src/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
